[workspace]
members = [
    "crates/pixeldelta-core",
    "crates/pixeldelta-io",
    "crates/pixeldelta-report",
    "crates/pixeldelta-cli",
    "crates/pixeldelta-node",
]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ebiryu/pixeldelta"

[profile.bench]
debug = true
