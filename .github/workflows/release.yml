# Keeps a release pull request in step with what has landed on main, and tags
# the release when that pull request is merged.
#
# release-please reads the Conventional Commits since the last v tag, works out
# the next version, and writes it into CHANGELOG.md and every manifest listed in
# release-please-config.json. Merging the pull request creates the tag v<version>
# and the GitHub release; the tag is what starts the publish job in ci.yml.
#
# Nothing here publishes. Whether to release is the decision of merging the pull
# request, and until then no tag exists.
name: Release

on:
  push:
    branches: [main]
  # Rebuilds the pull request without waiting for a push, after a change to the
  # release configuration.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    steps:
      # An event raised with GITHUB_TOKEN starts no workflow run, so a tag
      # pushed with it would not reach the publish job in ci.yml. Every write
      # below goes through this token instead.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      # The steps below finish the pull request release-please just wrote. They
      # run on its branch, and amend its commit so the pull request stays at one
      # commit whichever way it is merged.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          # A shallow fetch would leave out the parent the amend below needs.
          fetch-depth: 0
          # The amend is pushed with it too, so the pull request gets a CI run.
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        with:
          node-version-file: .node-version
      # The workspace members carry the version into Cargo.lock, which
      # release-please has no updater for. cargo writes it, so that the lock file
      # is not edited by a second set of rules.
      #
      # The version check is the guard on release-please-config.json: it names
      # the manifests to write, tools/release/version.mjs names the manifests
      # that have to agree, and a name missing from the first fails here.
      - name: Complete the release commit
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: |
          set -eu
          node tools/release/version.mjs
          cargo update --workspace
          if [ -z "$(git status --porcelain)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --amend --no-edit
          git push --force-with-lease
